<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101923"><title>왕실과 교회의 전쟁 · 제1장</title>
<script src="https://cdn.jsdelivr.net/pyodide/v314.0.7/full/pyodide.js"></script>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;background:#111821;color:#f5eddf}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -20%,#394352,#18232d 55%,#10151c)}
header{width:min(1040px,100%);margin:auto;padding:15px 18px;display:flex;justify-content:space-between;align-items:center;gap:14px}h1{margin:0;color:#f1d49a;font-size:clamp(16px,3vw,23px);letter-spacing:.04em}#state{font-size:12px;color:#bec8c7}main{width:min(1040px,100%);margin:auto;padding:0 16px 20px}#wrap{position:relative;border:1px solid #9f896360;border-radius:15px;overflow:hidden;background:#19232c;box-shadow:0 18px 60px #0007}canvas{display:block;width:100%;height:auto;aspect-ratio:8/5;image-rendering:pixelated;touch-action:none}#error{display:none;position:absolute;inset:0;z-index:10;align-content:center;justify-items:center;gap:14px;padding:clamp(16px,5vw,36px);color:#ffd6c8;background:#1a1010f2}#errorText{width:min(720px,100%);max-height:55vh;margin:0;white-space:pre-wrap;overflow:auto;font:12px/1.5 ui-monospace,monospace}#retry{min-width:150px;padding:11px 18px;border:0;border-radius:9px;background:#e3c37f;color:#20232a;font:inherit;font-weight:800;cursor:pointer}#setup{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(#101923dd,#101923f5);padding:24px}.card{width:min(460px,100%);border:1px solid #e4c78366;border-radius:18px;background:#17232ff2;padding:clamp(20px,5vw,36px);box-shadow:0 20px 60px #0007}.eyebrow{font-size:11px;color:#e4c783;letter-spacing:.2em}.card h2{font-size:clamp(28px,6vw,46px);line-height:1.1;margin:10px 0}.card p{color:#c9d2d0;font-size:14px}.card label{display:block;color:#d6d4ca;font-size:13px;margin:18px 0 6px}.card input{width:100%;padding:12px;border:1px solid #ffffff30;background:#0d1720;color:white;border-radius:9px;font:inherit}.card button{margin-top:12px;width:100%;padding:12px;background:#e3c37f;border:0;border-radius:9px;color:#20232a;font-weight:800;font:inherit;cursor:pointer}.controls{width:min(960px,100%);margin:10px auto 0;display:flex;flex-wrap:wrap;justify-content:center;gap:6px 15px;color:#bec8c7;font-size:12px}.controls b{color:#f1d49a}.mobile{display:none;width:min(960px,100%);margin:12px auto 0;grid-template-columns:minmax(112px,36%) minmax(0,1fr);align-items:center;gap:8px;touch-action:none;user-select:none}.group{display:grid;gap:5px;align-items:center;justify-content:center}.dpad{grid-template-columns:repeat(3,minmax(30px,1fr));grid-template-rows:repeat(3,40px)}.dpad span{width:100%;height:100%}.actions{grid-template-columns:repeat(3,minmax(0,1fr))}.key{min-width:0;width:100%;height:42px;padding:0 3px;border:1px solid #88795f;border-radius:10px;color:#f5eddf;background:#26333d;font-size:13px;font-weight:800;touch-action:none}.dpad .key{height:100%;padding:0}.key:active{background:#806c4a}@media(pointer:coarse){.mobile{display:grid}}@media(max-width:600px){header{padding:10px}main{padding:0 6px 14px}.controls{font-size:10px;gap:4px 8px}.mobile{grid-template-columns:minmax(102px,36%) minmax(0,1fr);gap:6px}.actions{grid-template-columns:repeat(2,minmax(0,1fr))}.dpad{grid-template-rows:repeat(3,36px)}.key{height:38px;font-size:12px}}
</style><style>
#setup{place-items:center start;padding:clamp(12px,4vw,40px);background-image:linear-gradient(90deg,#101923e8 0%,#101923bd 38%,#10192324 70%,#10192358 100%),linear-gradient(0deg,#101923a8 0%,#10192312 52%,#10192355 100%),url("./assets/chapter1-title.jpg");background-position:center,center,center;background-size:auto,auto,cover;background-repeat:no-repeat}
#setup .card{width:min(420px,100%);border-color:#e4c78388;background:#17232fe8;backdrop-filter:blur(4px)}
@media(max-width:600px){#setup{position:fixed;z-index:20;inset:0;height:100vh;height:100dvh;overflow-y:auto;overscroll-behavior:contain;place-items:center;align-content:safe center;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));background-position:center,center,58% center}}
</style></head>
<body>
<header><h1>왕실과 교회의 전쟁 <span style="font-size:.7em;color:#b8c5c5">· 제1장</span></h1><div id="state">Python 게임 준비 중…</div></header>
<main><div id="wrap"><canvas id="game" width="960" height="600" aria-label="탑다운 판타지 RPG"></canvas><section id="error" role="alert" aria-live="assertive"><pre id="errorText"></pre><button id="retry" type="button">다시 시도</button></section><section id="setup"><form class="card" id="nameForm"><div class="eyebrow">TOP-DOWN TURN RPG</div><h2>숲과 왕관,<br>교회의 전쟁</h2><p>이름만 정하고 세계에 들어가세요. 종족·성별·시작 진영은 무작위로 정해집니다. 수인은 왕실에서 시작하지 않습니다.</p><label for="playerName">모험가 이름</label><input id="playerName" maxlength="14" autocomplete="off" placeholder="이름 입력" value=""><button id="start" type="submit" disabled>게임 준비 중…</button><button id="continue" type="button" hidden>이어서 하기</button><small id="saveHint" style="display:none;color:#c5d1c5;text-align:center;margin-top:10px">이 브라우저에 저장된 모험을 이어갑니다.</small></form></section></div>
<div class="controls"><span><b>WASD/방향키</b> 이동</span><span><b>E</b> 상호작용·안내 닫기</span><span><b>M</b> 지도 열기/닫기</span><span><b>전투 1</b> 공격 메뉴 → 1 기본 / 2 스킬</span><span><b>2</b> 방어 · <b>3</b> 도주 · <b>4/H</b> 붕대</span><span><b>Q</b> 퀘스트 · <b>I</b> 소지품</span></div>
<div class="mobile" aria-label="터치 조작"><div class="group dpad" aria-label="이동"><span aria-hidden="true"></span><button class="key" data-hold="ArrowUp" aria-label="위로 이동">▲</button><span aria-hidden="true"></span><button class="key" data-hold="ArrowLeft" aria-label="왼쪽 이동">◀</button><button class="key" data-press="e" aria-label="상호작용">E</button><button class="key" data-hold="ArrowRight" aria-label="오른쪽 이동">▶</button><span aria-hidden="true"></span><button class="key" data-hold="ArrowDown" aria-label="아래로 이동">▼</button><span aria-hidden="true"></span></div><div class="group actions" aria-label="게임 조작"><button class="key" data-press="1">공격</button><button class="key" data-press="2">방어/기술</button><button class="key" data-press="3">도주</button><button class="key" data-press="h">붕대</button><button class="key" data-press="q">퀘스트</button><button class="key" data-press="i">소지품</button><button class="key" data-press="m">지도</button></div></div>
</main>
<script>
(()=>{'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),state=document.getElementById('state'),setup=document.getElementById('setup'),err=document.getElementById('error'),errorText=document.getElementById('errorText'),retry=document.getElementById('retry'),start=document.getElementById('start'),continueButton=document.getElementById('continue'),saveHint=document.getElementById('saveHint'),SAVE_KEY='kingdom-church-rpg-save-v1';
const held=new Set(),presses=[];let click=null,py=null,last=0,acc=0,pyFns=null;ctx.imageSmoothingEnabled=false;
function color(v){return v&&v!=='None'?v:'transparent'}
function draw(payload){const a=JSON.parse(payload);ctx.clearRect(0,0,960,600);for(const q of a){if(q.t==='r'){if(q.c&&q.c!=='#00000000'){ctx.fillStyle=color(q.c);ctx.fillRect(q.x,q.y,q.w,q.h)}if(q.o){ctx.strokeStyle=q.o;ctx.lineWidth=1;ctx.strokeRect(q.x+.5,q.y+.5,q.w-1,q.h-1)}}else if(q.t==='o'){ctx.beginPath();ctx.ellipse(q.x+q.w/2,q.y+q.h/2,Math.max(.1,q.w/2),Math.max(.1,q.h/2),0,0,Math.PI*2);ctx.fillStyle=color(q.c);ctx.fill();if(q.o){ctx.strokeStyle=q.o;ctx.stroke()}}else if(q.t==='c'){ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,Math.PI*2);ctx.fillStyle=color(q.c);ctx.fill();if(q.o){ctx.strokeStyle=q.o;ctx.stroke()}}else if(q.t==='l'){ctx.beginPath();ctx.moveTo(q.x1,q.y1);ctx.lineTo(q.x2,q.y2);ctx.strokeStyle=color(q.c);ctx.lineWidth=q.w||2;ctx.lineCap='round';ctx.stroke()}else if(q.t==='p'){ctx.beginPath();for(let i=0;i<q.pts.length;i+=2){if(i===0)ctx.moveTo(q.pts[i],q.pts[i+1]);else ctx.lineTo(q.pts[i],q.pts[i+1])}ctx.closePath();ctx.fillStyle=color(q.c);ctx.fill();if(q.o){ctx.strokeStyle=q.o;ctx.stroke()}}else if(q.t==='t'){ctx.fillStyle=color(q.c);ctx.font=`${q.size}px system-ui, sans-serif`;ctx.textAlign=q.a||'left';ctx.textBaseline='middle';ctx.fillText(q.s,q.x,q.y,760)}}}
function readSave(){try{return localStorage.getItem(SAVE_KEY)}catch{return null}}
function writeSave(value){try{localStorage.setItem(SAVE_KEY,value)}catch(e){console.warn('자동 저장에 실패했습니다.',e)}}
window.gameBridge={draw,save:writeSave};
function showError(e){err.style.display='grid';errorText.textContent=String(e)+'\n\n네트워크 연결을 확인한 뒤 다시 시도해 주세요.';retry.disabled=false;document.getElementById('state').textContent='게임 로딩 오류'}
function isTextEntry(target){return target instanceof HTMLElement&&(target.matches('input,textarea,select')||target.isContentEditable)}
window.addEventListener('keydown',e=>{const k=e.key;if(isTextEntry(e.target))return;if(e.target instanceof HTMLElement&&e.target.closest('button')&&['Enter',' '].includes(k))return;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(k))e.preventDefault();held.add(k);if(!e.repeat)presses.push(k.length===1?k.toLowerCase():k)});
window.addEventListener('keyup',e=>held.delete(e.key));
window.addEventListener('blur',()=>{held.clear();presses.length=0;click=null});
canvas.addEventListener('pointerdown',e=>{const r=canvas.getBoundingClientRect();click={x:(e.clientX-r.left)*960/r.width,y:(e.clientY-r.top)*600/r.height};canvas.focus()});
document.querySelectorAll('[data-hold]').forEach(b=>{const k=b.dataset.hold;b.addEventListener('pointerdown',e=>{e.preventDefault();held.add(k);b.setPointerCapture(e.pointerId)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,()=>held.delete(k)))});
document.querySelectorAll('[data-press]').forEach(b=>b.addEventListener('click',e=>{e.preventDefault();presses.push(b.dataset.press)}));
async function load(){try{state.textContent='Pyodide 런타임 불러오는 중…';py=await loadPyodide();state.textContent='Python 게임 불러오는 중…';const src=await fetch('./game.py',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(`game.py HTTP ${r.status}`);return r.text()});await py.runPythonAsync(src);pyFns={start:py.globals.get('start_game'),resume:py.globals.get('resume_game'),save:py.globals.get('save_game'),tick:py.globals.get('tick')};state.textContent='준비 완료';start.disabled=false;start.textContent='새 모험 시작';if(readSave()){continueButton.hidden=false;saveHint.style.display='block';}}catch(e){showError(e)}}
function frame(t){if(!pyFns){requestAnimationFrame(frame);return}if(!last)last=t;const dt=Math.min(.05,(t-last)/1000);last=t;acc+=dt;if(acc>=1/30){try{pyFns.tick(acc,JSON.stringify([...held]),JSON.stringify(presses.splice(0)),JSON.stringify(click));}catch(e){showError(e)}acc=0;click=null}requestAnimationFrame(frame)}
retry.addEventListener('click',()=>window.location.reload());load();requestAnimationFrame(frame);
document.getElementById('nameForm').addEventListener('submit',e=>{e.preventDefault();if(!pyFns)return;if(readSave()&&!confirm('저장된 모험을 새 모험으로 덮어쓸까?'))return;try{presses.length=0;held.clear();pyFns.start(document.getElementById('playerName').value.trim());setup.style.display='none';canvas.focus();state.textContent='항해 중 · 자동 저장';}catch(e){showError(e)}});
continueButton.addEventListener('click',()=>{if(!pyFns)return;const saved=readSave();if(!saved)return;try{if(!pyFns.resume(saved)){continueButton.hidden=true;saveHint.textContent='저장 데이터를 읽지 못했습니다. 새 모험을 시작할 수 있습니다.';return}setup.style.display='none';canvas.focus();state.textContent='이어하기 · 자동 저장';}catch(e){showError(e)}});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){held.clear();presses.length=0;click=null;if(pyFns)try{pyFns.save()}catch(e){console.warn('마지막 자동 저장에 실패했습니다.',e)}}});
window.addEventListener('pagehide',()=>{if(pyFns)try{pyFns.save()}catch(e){console.warn('마지막 자동 저장에 실패했습니다.',e)}});
})();
</script></body></html>
